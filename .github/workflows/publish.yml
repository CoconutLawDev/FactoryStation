name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging -c Release --no-restore

    - name: Package Server
      run: |
        dotnet run \
          --project Content.Packaging \
          server \
          --platform linux-x64

    - name: Package Clients
      run: |
        dotnet run \
          --project Content.Packaging \
          client \
          --platform win-x64 \
          --platform linux-x64 \
          --platform osx-x64 \
          --platform osx-arm64

    - name: Archive Server
      run: |
        cd RobustToolbox/bin/Server/linux-x64/publish
        tar -czf /home/runner/work/FactoryStation/FactoryStation/server.tar.gz .

    - name: Copy Client ACZ
      run: |
        cp release/SS14.Client.zip /home/runner/work/FactoryStation/FactoryStation/

    - name: Checksums
      run: |
        cd /home/runner/work/FactoryStation/FactoryStation
        sha256sum server.tar.gz SS14.Client.zip > SHA256SUMS.txt

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: |
          server.tar.gz
          SS14.Client.zip
          SHA256SUMS.txt
