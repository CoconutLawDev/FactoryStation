name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Show release
      run: |
        ls -la release/
        echo "=== DIRS ==="
        find release -maxdepth 2 -type d

    - name: Archive server
      run: |
        cd release
        tar -czf ../server.tar.gz Server_linux-x64

    - name: Copy ACZ
      run: |
        cp release/SS14.Client.zip .

    - name: Checksums
      run: |
        sha256sum server.tar.gz SS14.Client.zip > SHA256SUMS.txt

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: |
          server.tar.gz
          SS14.Client.zip
          SHA256SUMS.txt
