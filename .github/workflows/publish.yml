name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging -c Release --no-restore

    - name: Package Server
      run: |
        dotnet run \
          --project Content.Packaging \
          server \
          --platform linux-x64

    - name: Package Clients
      run: |
        dotnet run \
          --project Content.Packaging \
          client \
          --platform win-x64 \
          --platform linux-x64 \
          --platform osx-x64 \
          --platform osx-arm64

    - name: Show release directory
      run: |
        echo "====== CURRENT DIR ======"
        pwd
        echo "====== FILES ======"
        find . -maxdepth 4 | sort
        echo "====== RELEASE ======"
        find release -maxdepth 5 2>/dev/null || true
        echo "====== BIN ======"
        find bin -maxdepth 5 2>/dev/null || true
        echo "====== PUBLISH ======"
        find publish -maxdepth 5 2>/dev/null || true

    - name: Archive server
      run: |
        cd release
        tar -czf ../server.tar.gz Server

    - name: Archive Windows Client
      run: |
        cd release
        zip -r ../client-win-x64.zip Windows_x64

    - name: Archive Linux Client
      run: |
        cd release
        tar -czf ../client-linux-x64.tar.gz Linux_x64

    - name: Archive macOS Intel
      run: |
        cd release
        zip -r ../client-osx-x64.zip OSX_x64

    - name: Archive macOS Apple Silicon
      run: |
        cd release
        zip -r ../client-osx-arm64.zip OSX_arm64

    - name: Checksums
      run: |
        sha256sum *.gz *.zip > SHA256SUMS.txt

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: |
          server.tar.gz
          client-win-x64.zip
          client-linux-x64.tar.gz
          client-osx-x64.zip
          client-osx-arm64.zip
          SHA256SUMS.txt
