name: Build Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Server
        run: dotnet publish Content.Server/Content.Server.csproj -c Release -o publish --self-contained true

      - name: Package Server
        run: |
          cd publish
          tar -czf ../server.tar.gz .
          sha256sum ../server.tar.gz > ../server.tar.gz.sha256
          mv ../server.tar.gz ../server.tar.gz.sha256 ..

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            server.tar.gz
            server.tar.gz.sha256
