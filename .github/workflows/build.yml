name: Build Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Content.Server/Content.Server.csproj

      - name: Fix config conflict
        run: |
          : > RobustToolbox/Robust.Server/server_config.toml
          : > Content.Server/server_config.toml

      - name: Publish Server
        run: |
          dotnet publish Content.Server/Content.Server.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish \
            -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Package Server
        run: |
          cd publish
          rm -f server_config.toml
          tar -czf ../server.tar.gz .
          sha256sum ../server.tar.gz > ../server.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            server.tar.gz
            server.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            server.tar.gz
            server.tar.gz.sha256
