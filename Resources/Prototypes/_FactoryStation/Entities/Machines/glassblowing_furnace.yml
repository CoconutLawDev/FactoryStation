- type: entity
  id: GlassBlowingFurnace
  parent: BaseLatheLube
  name: стеклодувная печь
  description: "Промышленная печь используется для выплавки стекла из песка."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/glassblowing_furnace.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
  - type: Machine
    board: GlassBlowingFurnaceCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: burning
    staticPacks:
      - ToolsStatic
  - type: ItemSlots
    slots:
      heat_sink:
        name: Радиаторная пластина
        whitelist:
          components:
          - HeatSink
