- type: entity
  id: PuddleFactoryLubricant
  parent: PuddleTemporary
  name: лужа индустриальной смазки
  description: Скользкая маслянистая жидкость. Лучше не наступать.
  components:
  - type: Sprite
    sprite: Fluids/puddle.rsi
    state: splat0
  - type: Slippery
    launchForwardsMultiplier: 1.5
    paralyzeTime: 2
    intersectPercent: 0.3
    requiredTriggeredSpeed: 0
  - type: TimedDespawn
    lifetime: 120
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 5
  - type: StepTrigger
    intersectRatio: 0.1
  - type: FootstepModifier
    footprintSprite:
      sprite: Fluids/puddle.rsi
      state: splat0

- type: entity
  id: PuddleFactoryLubricantTrace
  parent: PuddleTemporary
  name: следы смазки
  description: Маслянистые следы.
  components:
  - type: Sprite
    sprite: Fluids/puddle.rsi
    state: splat1
  - type: TimedDespawn
    lifetime: 30
