# Общий базовый класс для всей руды
- type: entity
  abstract: true
  parent: BaseSheet
  id: SheetFactoryOreBase
  description: несколько кусков руды, используемой в различных производственных процессах.
  components:
  - type: Damageable
    damageModifierSet: Metallic
  - type: GuideHelp
    guides:
    - ExpandingRepairingStation


# =============================================================================
# Медная руда
# =============================================================================
- type: entity
  abstract: true
  parent: SheetFactoryOreBase
  id: SheetFactoryOreCopperBase
  description: несколько кусков медной руды.
  components:
  - type: Sprite
    sprite: _FactoryStation/Objects/Materials/factory.rsi
  - type: Item
    sprite: _FactoryStation/Objects/Materials/factory.rsi
  - type: Tag
    tags:
    - OreCopperFact
    - RawMaterial
    - Sheet
    - Ore

- type: entity
  parent: SheetFactoryOreCopperBase
  id: OreCopperSheet
  name: "медная руда"
  suffix: Full
  components:
  - type: PhysicalComposition
    materialComposition:
      OreCopperFact: 100
  - type: Stack
    stackType: OreCopperSheet
    baseLayer: icon
    layerStates:
    - icon
    - icon
  - type: Sprite
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    heldPrefix: OreCopperSheet

- type: entity
  parent: OreCopperSheet
  id: OreCopperSheet10
  name: "медная руда"
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  parent: OreCopperSheet
  id: OreCopperSheet1
  name: "медная руда"
  suffix: Single
  components:
  - type: Stack
    count: 1

