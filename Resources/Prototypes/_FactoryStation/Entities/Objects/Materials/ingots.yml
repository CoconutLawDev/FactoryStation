# =============================================================================
# Общий базовый класс для всех слитков
# =============================================================================
- type: entity
  abstract: true
  parent: BaseSheet
  id: SheetFactoryIngotBase
  description: слиток металла, используемый в различных производственных процессах.
  components:
  - type: Damageable
    damageModifierSet: Metallic
  - type: GuideHelp
    guides:
    - ExpandingRepairingStation
  - type: Tag
    tags:
    - Ingot
    - RawMaterial
    - Sheet

# =============================================================================
# Общий базовый класс для всех листов
# =============================================================================
- type: entity
