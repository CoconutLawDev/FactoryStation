# =============================================================================
# Железные слитки
# =============================================================================
- type: entity
  abstract: true
  parent: SheetFactoryIngotBase
  id: SheetFactoryIngotIronBase
  description: железный слиток.
  components:
  - type: Sprite
    sprite: _FactoryStation/Items/Materials/iron_ingot.rsi
  - type: Item
    sprite: _FactoryStation/Items/Materials/iron_ingot.rsi
  - type: Tag
    tags:
    - IngotIron
    - Ingot

- type: entity
  parent: SheetFactoryIngotIronBase
  id: IngotIronSheet
  name: "железный слиток"
  suffix: Full
  components:
  - type: PhysicalComposition
    materialComposition:
      IngotIron: 100
  - type: Stack
    stackType: IngotIronSheet
    baseLayer: icon
    layerStates:
    - icon
    - icon
  - type: Sprite
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    heldPrefix: IngotIronSheet

- type: entity
  parent: IngotIronSheet
  id: IngotIronSheet10
  name: "железный слиток"
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  parent: IngotIronSheet
  id: IngotIronSheet1
  name: "железный слиток"
  suffix: Single
  components:
  - type: Stack
    count: 1

